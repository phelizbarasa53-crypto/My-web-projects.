
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <style>
        body {
  font-family: Arial, sans-serif;
  background-color: rosybrown;
}
.business-card {
  width: 300px;
  background-color: pink;
  padding: 20px;
  margin-top: 100px;
  text-align: center;
  font-size: 16px;
  margin-left: auto;
  margin-right: auto;
}
.profile-image {
  max-width: 100%;
  border-radius: 10px;
}
p {
  margin-bottom: 5px;
  margin-top: 5px;
}
a {
    text-decoration: none;
    }
    
    </style>
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="my profile pic">
        <p class="full-name">Phelix Barasa</p>
        <p class="designation">Cooperative Executive Officer</p>
        <p class="company">Ignition X</p>
        <hr>
        <p>Email Address</p>
        <p>Phone number</p>
        <a class="portfolio-link" href="https://www.freecodecamp.org" target="_blank">Portfolio</a>
        <hr>
        <div class="social-media">
        <h2>Connect with me</h2>
        <a href="https://www.freecodecamp.org" target="_blank">Twitter</a>
        <a href="https://freecodecamp.org" target="_blank">LinkedIn</a>
        <a href="https://www.freecodecamp.org" target="_blank">GitHub</a>
        </div>
    </div>
</body>

</html>
